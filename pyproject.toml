# Project identity and runtime dependencies
[project]
name = "smart-ai-gateway"
version = "0.2.0"
description = "DSAN 6700 App Deployment — mocked prototype of the Smart AI Gateway: a FastAPI gateway, a Streamlit Playground, and a Caddy proxy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "sv642-hub", email = "sv642@georgetown.edu" },
    { name = "verness_chin", email = "yc1348@georgetown.edu" },
    { name = "Pbaffes2", email = "pb1100@georgetown.edu" }
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

# Optional extras. Install with `uv sync --extra dev --extra playground`.
# The gateway image installs neither; the frontend image adds `playground`.
[project.optional-dependencies]
playground = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.28.1",
]

# Build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling: where to find the package sources (src/ layout)
[tool.hatch.build.targets.wheel]
packages = ["src/smart_gateway"]

# Test runner
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

# Linter and formatter
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
