# Project identity and runtime dependencies
[project]
name = "app-assignment-1"
version = "0.1.0"
description = "DSAN 6700 App Deployment — Assignment 1: a src/-layout package scaffold with a shared, reproducible uv environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "sv642-hub", email = "sv642@georgetown.edu" },
    { name = "verness_chin", email = "yc1348@georgetown.edu" },
    { name = "Pbaffes2", email = "pb1100@georgetown.edu" }
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

# Dev extra. Install with `uv sync --extra dev`.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx2>=2.12",
    "pre-commit>=3.7",
]

# Build backend
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling: where to find the package sources (src/ layout)
[tool.hatch.build.targets.wheel]
packages = ["src/app_assignment_1"]

# Test runner
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

# Linter and formatter
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
