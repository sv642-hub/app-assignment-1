# Architecture status: the source for docs/architecture.svg.
#
# Update this file in any PR that changes what is built, simulated or owned,
# then run:  uv run python scripts/render_architecture.py
# CI fails if docs/architecture.svg does not match this file.
#
# Status describes `main` after your PR merges. Do not track other open PRs here.
#
# Each item is one line with one of three marks:
#   built:     works on main with the real thing
#   simulated: works on main, but against a mock
#   todo:      planned, not built yet
# A box's status comes from its items: all built = Built, no built items =
# Not built (a mock alone does not count), anything else = Partly built.
#
# owner: a name from docs/TEAM_PLAN.md, or null if nobody owns it yet.
# Positions live under `layout` at the bottom; you rarely need to touch them.
# If the renderer says a box overflows, make that box taller there.

title: "Smart AI Gateway: technical architecture, marked with current status"
subtitle: "Planned design from the proposal. Marks show what is on main. Owners come from docs/TEAM_PLAN.md."

