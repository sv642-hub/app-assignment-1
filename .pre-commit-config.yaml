repos:
  # Keep rev at the ruff version in uv.lock, which CI runs: two versions can
  # format the same code differently (tests/test_precommit.py checks this).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Blocks a commit that adds a secret. CI scans the whole history too.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
