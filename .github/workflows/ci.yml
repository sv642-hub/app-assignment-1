name: CI

on:
  push:
  pull_request:

# Read-only by default; the publish job asks for more.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Throwaway database for the Postgres store tests. It lives only for this
    # job on the runner; the password is not used anywhere else.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and pin Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the environment from the lockfile
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Tests (pytest, Postgres store tests included)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres

  # Scans the whole Git history, not just the latest commit.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the config, the alert rules and their unit tests
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check config prometheus.yml
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 test rules alerts_test.yml

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the mocked stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the public proxy
        run: python3 scripts/smoke_compose.py http://localhost:8080
      - name: End-to-end check with Prometheus counters (mock backends)
        # An explicit --metrics-cmd, so a broken metrics command fails this
        # step instead of turning the counter checks into a SKIP.
        run: >-
          python3 scripts/e2e_check.py --base-url http://localhost:8080
          --metrics-cmd "docker compose exec -T gateway python -c 'import urllib.request as u; print(u.urlopen(\"http://127.0.0.1:8000/metrics\").read().decode())'"
      - name: Check Prometheus scrapes the gateway
        run: |
          for attempt in $(seq 1 20); do
            if docker compose exec -T prometheus \
                wget -qO- 'http://127.0.0.1:9090/api/v1/targets?state=active' \
                | grep -q '"health":"up"'; then
              echo "PASS: Prometheus gateway target is up"
              exit 0
            fi
            sleep 3
          done
          echo "Prometheus gateway target never came up"
          exit 1
      - name: Check Prometheus loaded the alert rules
        run: |
          docker compose exec -T prometheus \
            wget -qO- 'http://127.0.0.1:9090/api/v1/rules?type=alert' \
            | grep -q '"name":"GatewayDown"'
          echo "PASS: the gateway alert rules are loaded"
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down

  # Publishes the gateway and proxy images once every check above passed, tagged
  # with the commit sha (and, on a `vX.Y.Z` tag push, the version too). The
  # gateway image is then pulled back and smoke-tested. Pull requests from forks
  # have no package access, so only pushes publish.
  publish:
    if: github.event_name == 'push'
    needs: [ci, gitleaks, frontend, prometheus-rules, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_PATH: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gateway and proxy
        run: |
          base="${REGISTRY_PATH,,}"
          tags="${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="${tags} ${GITHUB_REF_NAME#v}"; fi
          docker build -t "${base}/gateway:${GITHUB_SHA}" .
          docker build -f frontend/Dockerfile -t "${base}/proxy:${GITHUB_SHA}" .
          for tag in ${tags}; do
            for name in gateway proxy; do
              docker tag "${base}/${name}:${GITHUB_SHA}" "${base}/${name}:${tag}"
              docker push "${base}/${name}:${tag}"
            done
          done
      - name: Pull the published images and record their digests
        run: |
          base="${REGISTRY_PATH,,}"
          for name in gateway proxy; do
            docker rmi "${base}/${name}:${GITHUB_SHA}"
            docker pull "${base}/${name}:${GITHUB_SHA}"
            docker inspect --format '{{index .RepoDigests 0}}' "${base}/${name}:${GITHUB_SHA}"
          done
      - name: Smoke-test the published gateway image
        # Mock Jev and Qwen with the in-memory store: no secrets, no database.
        run: |
          base="${REGISTRY_PATH,,}"
          docker run -d --name gateway-smoke -p 8000:8000 "${base}/gateway:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/v1/health
          curl -fsS -X POST http://127.0.0.1:8000/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message": "I lost my card"}' | grep -q '"reply"'
          echo "PASS: the published gateway image answers health and chat"
      - name: Show the container log
        if: failure()
        run: docker logs gateway-smoke
