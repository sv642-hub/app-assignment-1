name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Throwaway database for the Postgres store tests. It lives only for this
    # job on the runner; the password is not used anywhere else.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv and pin Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the environment from the lockfile
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Tests (pytest, Postgres store tests included)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the mocked stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the public proxy
        run: python3 scripts/smoke_compose.py http://localhost:8080
      - name: Check Prometheus scrapes the gateway
        run: |
          for attempt in $(seq 1 20); do
            if docker compose exec -T prometheus \
                wget -qO- 'http://127.0.0.1:9090/api/v1/targets?state=active' \
                | grep -q '"health":"up"'; then
              echo "PASS: Prometheus gateway target is up"
              exit 0
            fi
            sleep 3
          done
          echo "Prometheus gateway target never came up"
          exit 1
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down
