name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv and pin Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the environment from the lockfile
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Tests (pytest)
        run: uv run pytest

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the mocked stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the public proxy
        run: python3 scripts/smoke_compose.py http://localhost:8080
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down
