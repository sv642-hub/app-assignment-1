services:
  gateway:
    build: .
    env_file:
      - path: env/.env
        required: false
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # Caddy serves the built React app and proxies the API. It is the only
  # service with a published port.
  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
